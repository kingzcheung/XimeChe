name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librime-dev \
            libdbus-1-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      # .cargo/config.toml 把 libximecore patch 到 ../libximecore（本地开发
      # 工作流）；CI 上不存在该路径时 cargo 回退 Cargo.lock 锁定的旧 rev，
      # 缺语音相关 API 会导致编译失败——检出同仓库最新 main 保持一致。
      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose