name: Release

on:
  push:
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librime-dev \
            libdbus-1-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      # .cargo/config.toml 把 libximecore patch 到 ../libximecore（本地开发
      # 工作流）；CI 上不存在该路径时 cargo 回退 Cargo.lock 锁定的旧 rev，
      # 缺语音相关 API 会导致编译失败——检出同仓库最新 main 保持一致。
      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release

      # 语音运行库拷到 target/release：xime-pack 的 deb assets 引用该路径
      # （随包分发到 /usr/share/xime/lib，daemon rpath $ORIGIN/../share/xime/lib）。
      - name: Stage speech runtime libs
        run: |
          SRC=$(dirname "$(find target/sherpa-onnx-prebuilt -name 'libsherpa-onnx-c-api.so' | head -1)")
          cp "$SRC"/*.so target/release/

      - name: Build Debian package
        run: cargo deb -p xime

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xime-deb
          path: target/debian/xime_*_amd64.deb

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: xime-deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: xime_*_amd64.deb
          generate_release_notes: true